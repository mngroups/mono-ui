name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test:coverage, build, storybook:build]
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Read access to private @mono packages on the GitLab registry (group endpoint, and
      # the per-project tarball URLs the lockfile records). Without it a cold pnpm store
      # (any lockfile change) fails with a 404 on the @mono tarballs.
      - name: Configure registry tokens
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITLAB_NPM_TOKEN: ${{ secrets.GITLAB_NPM_TOKEN }}
          GITLAB_PACKAGE_GROUP_ID: ${{ vars.GITLAB_PACKAGE_GROUP_ID }}
        run: |
          : "${GITLAB_NPM_TOKEN:?Set the GITLAB_NPM_TOKEN secret}"
          : "${GITLAB_PACKAGE_GROUP_ID:?Set the GITLAB_PACKAGE_GROUP_ID Actions variable}"
          {
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN"
            printf '@mono:registry=https://gitlab.com/api/v4/groups/%s/-/packages/npm/\n' "$GITLAB_PACKAGE_GROUP_ID"
            printf '//gitlab.com/api/v4/groups/%s/-/packages/npm/:_authToken=%s\n' "$GITLAB_PACKAGE_GROUP_ID" "$GITLAB_NPM_TOKEN"
            printf '//gitlab.com/api/v4/projects/:_authToken=%s\n' "$GITLAB_NPM_TOKEN"
          } > ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.check }}
